name: Test
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:conformance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install reference engines
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          python -m pip install beancount==3.2.0 beanquery==0.2.0
      - name: Check Org fixtures against Emacs
        run: bash scripts/org-expected.sh --check
      - name: Check Beancount fixtures against bean-check and bean-query
        run: python scripts/beancount-expected.py --check
      - name: Check GFM autolinks against native cmark-gfm
        run: bash scripts/gfm-reference.sh --check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Retain failing browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
