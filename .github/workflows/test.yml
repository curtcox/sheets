name: Test
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:conformance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference engines
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          python -m pip install beancount==3.2.0 beanquery==0.2.0
      - name: Check Org fixtures against Emacs
        run: bash scripts/org-expected.sh --check
      - name: Check Beancount fixtures against bean-check and bean-query
        run: python scripts/beancount-expected.py --check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Retain failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
