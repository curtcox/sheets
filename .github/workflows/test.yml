name: Test
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:conformance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install reference engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox lzip r-base r-cran-knitr r-cran-rmarkdown
          python -m pip install beancount==3.2.0 beanquery==0.2.0
          python -m pip install -r tests/fixtures/quarto/reference-requirements.txt
      - uses: quarto-dev/quarto-actions/setup@91dabb203fce7f899d10ef8e482d94b00f397cbc
        with:
          version: "1.10.19"
      - name: Check notebook controls against Quarto Jupyter and knitr
        run: python scripts/quarto-reference.py --check
      - name: Install the Org release the fixtures were recorded with
        run: |
          curl -sSfLo "$RUNNER_TEMP/org.tar.lz" https://elpa.gnu.org/packages/org-9.8.7.tar.lz
          echo "1a5d1efa34ff2bc110d6263aa4a86d5fe56668dfafc27082337f594d0e8151ec  $RUNNER_TEMP/org.tar.lz" | sha256sum -c
          tar --lzip -xf "$RUNNER_TEMP/org.tar.lz" -C "$RUNNER_TEMP"
          echo "SHEETS_ORG_LISP=$RUNNER_TEMP/org-9.8.7" >> "$GITHUB_ENV"
      - name: Check Org fixtures against Emacs
        run: bash scripts/org-expected.sh --check
      - name: Check Beancount fixtures against bean-check and bean-query
        run: python scripts/beancount-expected.py --check
      - name: Check GFM autolinks against native cmark-gfm
        run: bash scripts/gfm-reference.sh --check
      - name: Check AsciiMath corpus against pinned upstream data
        run: node scripts/asciimath-reference.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Retain failing browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
